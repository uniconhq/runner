name: primitive-ci

# The CI every primitive repository runs, called from its own ci.yaml as
# uniconhq/runner/.github/workflows/primitive-ci.yaml@<runner release>. The
# primitive is checked out as `primitive/` and this repo, at `runner-ref`, as
# `runner/` beside it: the primitive's tests find the contract at
# ../runner/schemas/primitive.schema.json, and primitive.yaml is checked
# against that same file. Everything is named after the calling repository,
# primitive-<name>.

on:
  workflow_call:
    inputs:
      runner-ref:
        description: >-
          The runner release the primitive is built against, the same tag the
          caller names this workflow at.
        type: string
        required: true

permissions:
  contents: read

env:
  NAME: ${{ github.event.repository.name }}
  PRIMITIVE_SCHEMA: ${{ github.workspace }}/runner/schemas/primitive.schema.json

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: primitive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: primitive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uniconhq/runner
          ref: ${{ inputs.runner-ref }}
          path: runner
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: primitive/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # The repo's file has no image line; the check fills in a placeholder
      # digest, as bootstrap later fills in the real one.
      - run: uv run --with ruamel-yaml==0.19.1 python ../runner/scripts/check_declaration.py "$PRIMITIVE_SCHEMA" .
      - run: uv run pytest -m "not image"

  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: primitive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: primitive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uniconhq/runner
          ref: ${{ inputs.runner-ref }}
          path: runner
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: primitive/uv.lock
      - run: uv sync --locked
      # The primitives build on primitive-base, built here from the runner
      # checkout so a change to the wrapper is tested with them before the
      # runner release that pushes it. Plain docker builds, which see the
      # images the daemon holds, where a buildx builder of its own would not.
      - name: Build primitive-base and the image on it
        run: |
          docker build -q -f ../runner/images/primitive-base/Dockerfile -t primitive-base:ci ../runner
          docker build -q --build-arg BASE_IMAGE=primitive-base:ci -t "$NAME:ci" .
      # Runs the image under sandbox flags: no network, read-only root, no
      # capabilities, seccomp, a user other than root (65532 here).
      - run: uv run pytest -m image
        env:
          PRIMITIVE_IMAGE: ${{ env.NAME }}:ci
          BASE_IMAGE: primitive-base:ci
