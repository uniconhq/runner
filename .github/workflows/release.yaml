name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestry check below needs main's history, not the tag alone.
          fetch-depth: 0

      # A release is what the backend pins, so it comes from the reviewed branch.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main; release only from main"
            exit 1
          fi

      # A tag that disagrees with the package version would ship a mislabelled
      # image.
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $declared"
            exit 1
          fi

      # The same checks as CI: a tag on a red commit must not become a release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_contract_files.py

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No :latest. Compiled plans pin the grading image by digest, and a moving
      # tag would run a plan against an image it was not compiled for.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/uniconhq/grading:${{ github.ref_name }}

      # The four contract files are what the backend pins, and a compiled plan
      # records the digest.
      - uses: softprops/action-gh-release@v3
        with:
          body: |
            Grading image: `ghcr.io/uniconhq/grading:${{ github.ref_name }}`
            Digest: `${{ steps.build.outputs.digest }}`
          files: |
            schemas/plan.schema.json
            schemas/envelope.schema.json
            schemas/verdict.schema.json
            registry.json
