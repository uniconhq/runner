image: ghcr.io/uniconhq/primitive-sandbox-run@sha256:2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a
title: Run program
description: Runs a program on an input and records its output, time and memory.
batch: true
network: false
limits: {time_ms: 5000, cpu_ms: 5000, memory_mb: 256, pids: 128, output_mb: 64, gpus: 0}
limits_from:
  time_ms: {input: time_limit, scale: 2000, add: 3000}
  cpu_ms: {input: time_limit, scale: 2000, add: 3000}
  memory_mb: {input: memory_limit, scale: 1, add: 256}
  pids: {input: max_processes, scale: 1, add: 0}
  output_mb: {input: output_limit, scale: 1, add: 0}
  gpus: {input: gpus, scale: 1, add: 0}
inputs:
  binary: {type: file, runs: true, description: The program to run.}
  input: {type: file, runs: false}
  data: {type: folder, runs: false, optional: true}
  time_limit: {type: number}
  memory_limit: {type: number}
  max_processes: {type: number, optional: true}
  output_limit: {type: number, optional: true}
  gpus: {type: number, optional: true}
  mode: {type: enum, options: [strict, lenient], optional: true}
  echo: {type: boolean, optional: true}
  api_key: {type: text, optional: true, secret: true}
outputs:
  output: {type: file}
  trace: {type: folder, optional: true}
  verdict: {type: enum, options: [ok, bad], optional: true}
  time_ms: {type: number, description: The CPU time the program used in milliseconds.}
  memory_kb: {type: number}
  outcome:
    type: outcome
    description: Whether the program ran within its limits.
    outcomes:
      accepted: the program ran within its limits
      time_limit: it ran out of time
      memory_limit: it used more memory than allowed
      output_limit: it printed more than allowed
      runtime_error: it crashed
