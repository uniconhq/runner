name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      # A schema change that forgets the examples is caught here, not at a grading.
      - run: uv run python scripts/check_contract_files.py

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [harness, worker, clone, socket-filter]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: images/${{ matrix.name }}/Dockerfile
          push: false
          load: true
          tags: unicon-${{ matrix.name }}:ci

      # Run the harness the way the CI does, with nothing set: exit 2, and the
      # code first on stderr.
      - name: The harness refuses an empty environment
        if: matrix.name == 'harness'
        run: |
          set +e
          stderr="$(docker run --rm unicon-harness:ci 2>&1 >/dev/null)"
          status=$?
          set -e
          echo "$stderr"
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2, got $status"
            exit 1
          fi
          case "$stderr" in
            "unicon-harness: missing_environment:"*) ;;
            *) echo "expected a missing_environment line"; exit 1 ;;
          esac

      # The other three carry a placeholder that names the image and exits 0.
      - name: The placeholder runs
        if: matrix.name != 'harness'
        run: |
          output="$(docker run --rm unicon-${{ matrix.name }}:ci)"
          echo "$output"
          case "$output" in
            "unicon-${{ matrix.name }}: placeholder"*) ;;
            *) echo "expected the placeholder line"; exit 1 ;;
          esac
