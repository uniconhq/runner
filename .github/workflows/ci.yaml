name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      # A schema change that forgets the examples is caught here, not at a grading.
      - run: uv run python scripts/check_contract_files.py
      # The worker and primitive-base images share one base by digest.
      - name: The python base is one digest
        run: |
          found="$(grep -h '^FROM python' images/*/Dockerfile | cut -d' ' -f2 | sort -u)"
          echo "$found"
          test "$(echo "$found" | wc -l)" -eq 1

  # The step wrapper in primitive-base against a real daemon. The tests
  # build the images they need.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked
      - run: docker version
      - run: uv run pytest -m docker

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [worker, primitive-base]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.name }}/Dockerfile
          push: false
          load: true
          tags: unicon-${{ matrix.name }}:ci

      # The worker carries a placeholder that names the image and exits 0.
      - name: The placeholder runs
        if: matrix.name == 'worker'
        run: |
          output="$(docker run --rm unicon-worker:ci)"
          echo "$output"
          case "$output" in
            "unicon-worker: placeholder"*) ;;
            *) echo "expected the placeholder line"; exit 1 ;;
          esac

      # With no data link the wrapper runs the image's command in its own
      # place, so a primitive started directly behaves as before it.
      - name: The wrapper runs its command without a data link
        if: matrix.name == 'primitive-base'
        run: |
          output="$(docker run --rm unicon-primitive-base:ci echo passed through)"
          echo "$output"
          test "$output" = "passed through"

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
      - name: zizmor
        run: uvx zizmor@1.31.1 --offline --format github .github/workflows
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
