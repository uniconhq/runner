[project]
name = "unicon-harness"
version = "0.5.0"
description = "The program inside the Unicon harness image, and the plan, envelope, verdict and primitive contracts it speaks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "jsonschema[format-nongpl]==4.26.0",
]

[project.scripts]
unicon-harness = "unicon_harness.main:run"

[project.urls]
Source = "https://github.com/uniconhq/runner"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.7",
    "types-jsonschema==4.26.0.20260518",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/unicon_harness"]

# The contract files are published as release assets from the repo root, so that
# is where they are edited. The wheel carries a copy so an installed harness can
# find them without knowing about a checkout.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "unicon_harness/schemas"

[tool.ruff]
line-length = 88
src = ["harness", "socket_filter", "scripts", "images"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = ["A002"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["harness", "socket_filter", "scripts", "images"]
mypy_path = ["harness", "socket_filter", "scripts"]
platform = "linux"

[tool.pytest.ini_options]
testpaths = [
    "harness/tests",
    "socket_filter/filter_tests",
    "images/clone_tests",
    "scripts/declaration_tests",
]
pythonpath = ["harness", "socket_filter", "images", "scripts"]
addopts = "-q -m 'not docker'"
markers = ["docker: runs against a real Docker daemon; `pytest -m docker`"]
