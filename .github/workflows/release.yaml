name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestry check below needs main's history, not the tag alone.
          fetch-depth: 0

      # A release is what deploy pins, so it comes from the reviewed branch.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main; release only from main"
            exit 1
          fi

      # A tag that disagrees with the package version would ship a mislabelled
      # image.
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $declared"
            exit 1
          fi

      # The same checks as CI: a tag on a red commit must not become a release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_contract_files.py

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Four images, each tagged with the release and never :latest. A plan
      # pins the harness by digest and a grading machine pins the other three
      # the same way, so a moving tag would run a plan against an image it was
      # not compiled for.
      - id: harness
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/harness/Dockerfile
          push: true
          tags: ghcr.io/uniconhq/harness:${{ github.ref_name }}
      - id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/worker/Dockerfile
          push: true
          tags: ghcr.io/uniconhq/worker:${{ github.ref_name }}
      - id: clone
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/clone/Dockerfile
          push: true
          tags: ghcr.io/uniconhq/clone:${{ github.ref_name }}
      - id: socket-filter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/socket-filter/Dockerfile
          push: true
          tags: ghcr.io/uniconhq/socket-filter:${{ github.ref_name }}

      # One file naming every image by digest, so deploy pins one release and
      # reads the four digests from it.
      - name: Write images.json
        run: |
          cat > images.json <<EOF
          {
            "release": "${{ github.ref_name }}",
            "images": {
              "harness": "ghcr.io/uniconhq/harness@${{ steps.harness.outputs.digest }}",
              "worker": "ghcr.io/uniconhq/worker@${{ steps.worker.outputs.digest }}",
              "clone": "ghcr.io/uniconhq/clone@${{ steps.clone.outputs.digest }}",
              "socket-filter": "ghcr.io/uniconhq/socket-filter@${{ steps.socket-filter.outputs.digest }}"
            }
          }
          EOF
          cat images.json

      # The four contract files and the four digests are what the rest of the
      # platform pins.
      - uses: softprops/action-gh-release@v3
        with:
          body: |
            | Image | Digest |
            |---|---|
            | `ghcr.io/uniconhq/harness:${{ github.ref_name }}` | `${{ steps.harness.outputs.digest }}` |
            | `ghcr.io/uniconhq/worker:${{ github.ref_name }}` | `${{ steps.worker.outputs.digest }}` |
            | `ghcr.io/uniconhq/clone:${{ github.ref_name }}` | `${{ steps.clone.outputs.digest }}` |
            | `ghcr.io/uniconhq/socket-filter:${{ github.ref_name }}` | `${{ steps.socket-filter.outputs.digest }}` |
          files: |
            schemas/plan.schema.json
            schemas/envelope.schema.json
            schemas/verdict.schema.json
            schemas/primitive.schema.json
            images.json
