[project]
name = "unicon-runner"
version = "0.11.0"
description = "The step wrapper of Unicon's primitive images, and the plan, result, primitive, submission and job contracts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "jsonschema[format-nongpl]==4.26.0",
]

[project.urls]
Source = "https://github.com/uniconhq/runner"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruamel-yaml==0.19.1",
    "ruff==0.16.7",
    "types-jsonschema==4.26.0.20260518",
]

[tool.ruff]
line-length = 88
src = ["scripts", "images", "wrapper", "escape"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["scripts", "images", "wrapper", "escape"]
mypy_path = ["scripts", "wrapper"]
platform = "linux"

[tool.pytest.ini_options]
testpaths = [
    "scripts/declaration_tests",
    "wrapper/step_tests",
    "escape/escape_tests",
]
pythonpath = ["scripts", "wrapper"]
addopts = "-q -m 'not docker'"
markers = ["docker: runs against a real Docker daemon; `pytest -m docker`"]
